<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Search · Semantic search across EU Horizon funding</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
:root{
  /* entity hues (color encodes the data's taxonomy) + soft tints */
  --topic:#2D6CC0; --proj:#1F8A5B; --unit:#C2741C; --org:#7A4FB0; --res:#159C8E; --work:#4C63B6;
  --topic-s:rgba(45,108,192,.12); --proj-s:rgba(31,138,91,.13); --unit-s:rgba(194,116,28,.15);
  --org-s:rgba(122,79,176,.13); --res-s:rgba(21,156,142,.13); --work-s:rgba(76,99,182,.13);
  /* neutrals: graphite on paper */
  --bg:#FBFBFC; --surface:#FFFFFF; --surface-2:#F4F6F8;
  --ink:#1A1D23; --ink-2:#5A626E; --ink-3:#9097A1; --muted:#9097A1; --line:#E8EAEE; --line-2:#F0F2F5;
  --accent:#2D6CC0; --accent-s:rgba(45,108,192,.10); --chrome:#1B2A44;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --display:"Fraunces",Georgia,"Times New Roman","Songti SC",serif;
  --r-sm:7px; --r:11px; --r-lg:15px; --r-xl:20px;
  --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --sh-lg:0 10px 34px rgba(16,24,40,.13),0 2px 8px rgba(16,24,40,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
::selection{background:var(--accent-s)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- top bar ---- */
header{background:rgba(255,255,255,.85);backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line);padding:.5rem 1.25rem;display:flex;align-items:center;gap:1.1rem;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:.6rem;cursor:pointer;white-space:nowrap}
/* wordmark — refined serif, two-toned by weight; the identity */
.wm{font-family:var(--display);font-weight:540;font-size:1.2rem;letter-spacing:-.005em;color:var(--ink);line-height:1;white-space:nowrap}
.wm .s2{color:var(--ink-2);font-weight:430}
.gsearch{flex:1;position:relative;max-width:720px}
.gsearch .gi{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:.95rem;pointer-events:none}
#q{width:100%;padding:.6rem .9rem .6rem 2.3rem;border:1px solid var(--line);border-radius:var(--r);font-size:.9rem;
  outline:none;background:var(--surface-2);color:var(--ink);transition:background .15s,border-color .15s,box-shadow .15s}
#q::placeholder{color:var(--ink-3)}
#q:focus{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.hint{font-size:.72rem;color:var(--ink-3);white-space:nowrap}
.histbtn{display:flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:.4rem .7rem;cursor:pointer;color:var(--ink-2);font-size:.82rem;background:var(--surface);white-space:nowrap}
.histbtn:hover{border-color:var(--accent);color:var(--accent)}
.pbtn.del{color:var(--weak)} .pbtn.del:hover{border-color:var(--weak);color:var(--weak)}
.kbd{font-family:var(--mono);font-size:.66rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:.05em .35em;color:var(--ink-2);background:var(--surface)}

/* ---- command-palette search ---- */
#sug{position:absolute;top:calc(100% + .5rem);left:0;right:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--sh-lg);max-height:68vh;overflow:auto;z-index:30;display:none;padding:.35rem}
#sug .sg{padding:.5rem .65rem .25rem;font-size:.66rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.si{display:flex;align-items:center;gap:.6rem;padding:.5rem .65rem;cursor:pointer;border-radius:var(--r-sm)}
.si:hover,.si.sel{background:var(--surface-2)}
.si .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.si .nm{font-weight:600;color:var(--ink);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.si .sb{font-size:.78rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;flex:0 1 auto;font-variant-numeric:tabular-nums}
.si-go{background:var(--accent-s)}
.si-go .nm{color:var(--accent)}

main{max-width:1240px;margin:0 auto;padding:1.6rem 1.4rem 5rem}

/* ---- entity tags: soft pills ---- */
.tag{display:inline-flex;align-items:center;font-size:.68rem;font-weight:650;border-radius:999px;
  padding:.14em .6em;vertical-align:middle;white-space:nowrap;letter-spacing:.01em}
.t-t{background:var(--topic-s);color:var(--topic)} .t-p{background:var(--proj-s);color:var(--proj)}
.t-u{background:var(--unit-s);color:var(--unit)} .t-o{background:var(--org-s);color:var(--org)}
.t-r{background:var(--res-s);color:var(--res)} .t-w{background:var(--work-s);color:var(--work)}

/* ---- open-access badge (OpenAlex oa_status) ---- */
.oa{display:inline-flex;align-items:center;gap:.35em;font-size:.68rem;font-weight:650;border-radius:999px;
  padding:.14em .62em;vertical-align:middle;white-space:nowrap;letter-spacing:.01em}
.oa .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.oa-open{background:rgba(31,138,91,.13);color:#1F8A5B}
.oa-closed{background:var(--surface-2);color:var(--ink-3)}
.oa-sm{font-size:.66rem;padding:.1em .5em}

/* ---- info / settings panel ---- */
.hbtns{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.iconbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink-2);cursor:pointer;box-shadow:var(--sh);transition:color .12s,border-color .12s}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
#infomodal .modalcard{width:min(620px,95vw)}
.itabs{display:flex;gap:.1rem;border-bottom:1px solid var(--line);margin:.3rem 0 1.3rem}
.itab{display:flex;align-items:center;gap:.4rem;padding:.5rem .85rem;font-size:.85rem;font-weight:560;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s,border-color .12s}
.itab.on{color:var(--accent);border-bottom-color:var(--accent)}
.itab:not(.on):hover{color:var(--ink)}
.pipe{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.9rem 0;padding:.65rem .8rem;background:var(--surface-2);border-radius:var(--r);font-size:.8rem;font-weight:560;color:var(--ink-2)}
.pipe span{display:inline-flex;align-items:center;gap:.35rem}
.pipe span svg{color:var(--accent)}
.pipe i{color:var(--ink-3);font-style:normal}
.infobody{display:flex;flex-direction:column;gap:1.1rem;font-size:.9rem;line-height:1.62;color:var(--ink-2)}
.infobody h3{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:.45rem}
.infobody p{margin:.25rem 0}
.infobody .note{font-size:.82rem;color:var(--ink-3)}
.infobody code{background:var(--surface-2);border-radius:5px;padding:.1em .4em;font-family:var(--mono);font-size:.85em}
.infobody pre{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .8rem;overflow:auto;font-family:var(--mono);font-size:.74rem;line-height:1.55;color:var(--ink);margin:.5rem 0 0}
.iseg-row{display:inline-flex;gap:.25rem;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:.25rem;margin:.3rem 0 .7rem}
.iseg{padding:.4rem 1rem;border-radius:var(--r-sm);cursor:pointer;font-weight:560;font-size:.85rem;color:var(--ink-2)}
.iseg.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.krow{display:flex;align-items:center;gap:.7rem;margin:.5rem 0}
.krow>span{width:5rem;flex:0 0 auto;font-size:.8rem;color:var(--ink-3)}
.krow input{flex:1;padding:.5rem .7rem;border:1px solid var(--line);border-radius:var(--r-sm);font-family:var(--mono);font-size:.82rem;background:var(--surface);color:var(--ink)}
.krow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem 1rem;margin:.7rem 0 .9rem}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.8rem;color:var(--ink-2)}
.mrow select{flex:0 1 62%;padding:.35rem .5rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:.76rem;font-family:var(--mono);color:var(--ink)}
.ibtn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:var(--r-sm);padding:.5rem 1.2rem;font-weight:600;cursor:pointer;font-size:.85rem}
.ibtn:hover{filter:brightness(1.06)}
.fbnote{margin:.4rem 0 .2rem;font-size:.82rem;color:#9a5a00;background:rgba(194,116,28,.1);border:1px solid rgba(194,116,28,.3);border-radius:var(--r-sm);padding:.45rem .7rem}
.fbnote .note{color:#9a5a00;opacity:.8}
@media(max-width:560px){.mgrid{grid-template-columns:1fr}}

/* ---- breadcrumb ---- */
.crumbs{font-size:.82rem;color:var(--ink-3);margin-bottom:1.1rem;display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.crumbs a{color:var(--ink-2);font-weight:500} .crumbs a:hover{color:var(--accent)} .crumbs .sep{color:var(--ink-3);opacity:.6}

/* ---- entity header ---- */
.ehead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:1.3rem 1.5rem;margin-bottom:1.2rem;box-shadow:var(--sh);position:relative;overflow:hidden}
.ehead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ec,var(--ink-3))}
.ehead .et{font-size:1.5rem;font-weight:720;letter-spacing:-.02em;margin:.3rem 0 .1rem;line-height:1.2}
.ehead .em{font-size:.84rem;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:.3rem 1.3rem;margin-top:.55rem}
.ehead .em b{color:var(--ink-2);font-weight:600}
.objbox{margin-top:1.1rem;padding-top:1rem;border-top:1px solid var(--line-2);font-size:.88rem;line-height:1.65;
  color:var(--ink-2);white-space:pre-wrap;max-height:13em;overflow:auto}
.eyebrow{font-size:.72rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.qquote{border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:.5rem .85rem;margin:.5rem 0 .2rem;color:var(--ink-2);font-size:.92rem;line-height:1.5}
.kpis{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:.5rem .9rem;background:var(--surface);min-width:88px;font-size:.72rem;color:var(--ink-3);line-height:1.3}
.kpi b{display:block;font-family:var(--mono);font-size:1.3rem;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin-bottom:.1rem}
.kpi span{font-size:.72rem;color:var(--ink-3)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.9rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.22em .75em;font-size:.76rem;color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ink-3)} .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
a.chip{display:inline-flex;align-items:center;gap:.4rem;text-decoration:none}
a.chip:hover{border-color:var(--accent);color:var(--accent)}
.cdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chgroup{padding:.9rem 1.1rem;border-bottom:1px solid var(--line-2)}
.chgroup:last-child{border-bottom:none}
.chlbl{font-size:.74rem;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.6rem}
.neticons{position:absolute;bottom:1.1rem;right:1.2rem;display:flex;gap:.45rem}
.nbtn{display:flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:var(--r-sm);padding:.4rem .65rem;background:var(--surface);cursor:pointer;font-size:.78rem;color:var(--ink-2);box-shadow:var(--sh)}
.nbtn:hover{border-color:var(--accent);color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(16,20,30,.5);backdrop-filter:blur(3px);z-index:80;display:none;align-items:center;justify-content:center;padding:1.5rem}
.modalcard{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:min(1240px,95vw);max-height:93vh;overflow:auto;padding:1rem 1.2rem 1.2rem}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font-weight:650;font-size:.95rem}
.modalclose{cursor:pointer;color:var(--ink-3);font-size:1.05rem;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.modalclose:hover{background:var(--surface-2);color:var(--ink)}
.searching{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:4rem 1rem;text-align:center}
.spinner{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.searching .st{font-weight:650;color:var(--ink);font-size:1.02rem}
.searching .ss{font-size:.85rem;color:var(--ink-3);max-width:30em;line-height:1.6}
.searching .step{font-family:var(--mono);font-size:.82rem;color:var(--accent)}
.relscore{display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;padding:.12em .5em;border-radius:999px;font-family:var(--mono);font-weight:600;font-size:.78rem}
.apikey-note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.5rem 1.7rem;box-shadow:var(--sh);color:var(--ink-2);line-height:1.7;font-size:.92rem}
.apikey-note code{background:var(--surface-2);border-radius:5px;padding:.1em .45em;font-family:var(--mono);font-size:.88em}

/* ---- panels & rows ---- */
.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.1rem;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh)}
.panel .ph{padding:.7rem 1rem;font-weight:650;font-size:.85rem;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.panel .ph .ct{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);font-weight:500}
.panel .pl{max-height:440px;overflow:auto}
.row{display:flex;gap:.6rem;align-items:center;padding:.55rem 1rem;border-bottom:1px solid var(--line-2);cursor:pointer}
.row:last-child{border-bottom:none} .row:hover{background:var(--surface-2)}
.row .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.row .nm{flex:1;font-size:.86rem;min-width:0;color:var(--ink)}
.row .nm .s{display:block;font-size:.78rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1rem}
.row .mt{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);white-space:nowrap}
.row .star{color:var(--unit)}
.more{padding:.6rem;font-size:.8rem;color:var(--accent);cursor:pointer;text-align:center;font-weight:500} .more:hover{background:var(--surface-2)}
.ext{font-size:.8rem;color:var(--accent);font-weight:500;white-space:nowrap} .ext:hover{text-decoration:underline}
.empty{padding:1.2rem 1rem;font-size:.84rem;color:var(--ink-3)}

/* ---- home (centered search hero) ---- */
header.home-mode .gsearch, header.home-mode .hint{display:none}
.home{min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:680px;margin:0 auto;padding:1rem 1.2rem 6rem}
.wordmark-xl{font-family:var(--display);font-size:clamp(2.7rem,7.5vw,4.1rem);font-weight:540;letter-spacing:-.012em;line-height:1.02;color:var(--ink)}
.wordmark-xl .s2{color:var(--ink-2);font-weight:430}
.home-sub{margin-top:1rem;font-size:.96rem;color:var(--ink-3);font-weight:450;letter-spacing:.005em}
.hsearch{width:100%;max-width:584px;position:relative;margin:2rem 0 0}
.hsearch .gi{position:absolute;left:1.15rem;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:1.05rem;pointer-events:none}
.hsearch input{width:100%;padding:1.05rem 4.1rem 1.05rem 2.9rem;border:1px solid var(--line);border-radius:var(--r-lg);font-size:1.02rem;background:var(--surface);box-shadow:var(--sh);outline:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.hsearch input::placeholder{color:var(--ink-3)}
.hsearch input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-s),var(--sh)}
.hsearch .ent{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.68rem;color:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:.3em .55em;pointer-events:none;letter-spacing:.02em}
.hstats{margin:2.7rem 0 0;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;width:max-content;max-width:94vw}
.hstats span{padding:0 .85rem;border-right:1px solid var(--line);line-height:1.15}
.hstats span:last-child{border-right:none}
.hstats b{font-weight:600;font-size:.78rem}
.hstats .e-p{color:var(--proj)} .hstats .e-u{color:var(--unit)} .hstats .e-r{color:var(--res)} .hstats .e-w{color:var(--work)} .hstats .e-eu{color:var(--ink)}

/* ---- corner actions: buy-me-a-coffee + feedback (home only) ---- */
.corner{position:fixed;bottom:1.5rem;right:1.5rem;z-index:60;display:flex;align-items:center;gap:.75rem}
.bmc{position:relative}
.cbtn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.85);backdrop-filter:saturate(1.6) blur(10px);color:var(--ink-2);cursor:pointer;box-shadow:var(--sh);
  transition:color .15s,border-color .15s,box-shadow .15s}
.cbtn svg{width:20px;height:20px}
.cbtn:hover{color:var(--accent);border-color:var(--accent);box-shadow:var(--sh-lg)}
.cpop{position:absolute;bottom:calc(100% + .65rem);right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);padding:1rem;display:flex;gap:1rem;opacity:0;visibility:hidden;transform:translateY(8px);transition:all .25s}
.bmc:hover .cpop{opacity:1;visibility:visible;transform:translateY(0)}
.qr{display:flex;flex-direction:column;align-items:center;gap:.5rem;cursor:pointer;transition:transform .15s}
.qr:hover{transform:scale(1.05)}
.qrimg{width:96px;height:96px;border-radius:var(--r);overflow:hidden;background:#fff;padding:4px;box-shadow:var(--sh);flex:0 0 auto}
.qrimg img{width:100%;height:100%;object-fit:contain;display:block}
.qr span{font-size:.74rem;font-weight:600;color:var(--ink-2)}
.qr-big{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.qr-big .qrimg{width:256px;height:256px}
.qr-big .lbl{font-size:.85rem;font-weight:600;color:var(--ink-2);margin-top:.6rem;text-transform:capitalize}
.qr-big .hint{font-size:.66rem;color:var(--ink-3);margin-top:.2rem}
.fb{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.85);backdrop-filter:saturate(1.6) blur(10px);color:var(--ink-2);font-size:.85rem;font-weight:600;
  cursor:pointer;box-shadow:var(--sh);transition:color .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.fb svg{width:16px;height:16px;flex:0 0 auto}
.fb:hover{color:var(--accent);border-color:var(--accent);box-shadow:var(--sh-lg)}
@media(max-width:680px){.fb span{display:none}.fb{padding:.5rem;width:38px;height:38px;justify-content:center}}

/* ---- tabs (segmented control) ---- */
.tabs{display:inline-flex;gap:.2rem;margin:1.1rem 0 1.1rem;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:.25rem}
.tabb{padding:.5rem 1.2rem;border-radius:var(--r-sm);cursor:pointer;font-weight:560;font-size:.86rem;color:var(--ink-2);display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.tabb .c{font-family:var(--mono);font-size:.78rem;color:var(--ink-3)}
.tabb.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)} .tabb.on .c{color:var(--ink-2)}
.tabb:not(.on):hover{color:var(--ink)}

/* ---- project table ---- */
.scroll{max-height:680px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh)}
.tbl{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh);overflow:hidden}
.ptbl{width:100%;border-collapse:collapse;font-size:.85rem}
.ptbl th{background:var(--surface-2);text-align:center;padding:.7rem .85rem;border-bottom:1px solid var(--line);
  white-space:nowrap;font-size:.74rem;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.ptbl td{padding:.62rem .85rem;border-bottom:1px solid var(--line-2);cursor:pointer;vertical-align:top;color:var(--ink-2);text-align:center}
.ptbl tr:last-child td{border-bottom:none}
.ptbl tbody tr:hover td{background:var(--surface-2)}
.ptbl td b{color:var(--ink);font-weight:600}
.ptbl .num{white-space:nowrap}
.ptbl td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ptbl .l{text-align:left}                 /* long free-text columns (name / title / institution) stay left */
.pager{display:flex;gap:.8rem;align-items:center;margin:1rem 0;font-size:.82rem;color:var(--ink-3)}
.pbtn{border:1px solid var(--line);border-radius:var(--r-sm);padding:.4rem 1rem;cursor:pointer;background:var(--surface);color:var(--ink-2);font-weight:500;box-shadow:var(--sh)}
.pbtn:hover{border-color:var(--accent);color:var(--accent)}

/* ---- history list ---- */
.histlist{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh);overflow:hidden}
.histrow{display:flex;align-items:center;gap:1.2rem;padding:1.05rem 1.3rem;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .12s}
.histrow:last-child{border-bottom:none}
.histrow:hover{background:var(--surface-2)}
.histmain{flex:1;min-width:0}
.histq{font-size:.92rem;color:var(--ink);font-weight:560;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.histmeta{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);margin-top:.4rem;letter-spacing:.01em}
.histact{display:flex;align-items:center;gap:.5rem;flex:0 0 auto}
.histopen{border:1px solid var(--line);border-radius:var(--r-sm);padding:.42rem .95rem;font-size:.82rem;font-weight:560;color:var(--ink-2);background:var(--surface);box-shadow:var(--sh);transition:border-color .12s,color .12s}
.histrow:hover .histopen{border-color:var(--accent);color:var(--accent)}
.histdel{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--ink-3);font-size:.92rem;opacity:.5;transition:opacity .12s,background .12s,color .12s}
.histdel:hover{background:rgba(192,57,43,.1);color:#C0392B;opacity:1}

/* ---- network ---- */
.netwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1rem 1.1rem;box-shadow:var(--sh)}
.netbar{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem;flex-wrap:wrap}
.netlbl{font-size:.92rem;font-weight:650;color:var(--ink);display:flex;align-items:center;gap:.5rem}
.netlbl .ct{font-family:var(--mono);font-size:.76rem;color:var(--ink-3);font-weight:400}
.zoomctl{margin-left:auto;display:flex;gap:.3rem;align-items:center}
.zbtn{width:30px;height:30px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;
  font-size:1rem;color:var(--ink-2);display:flex;align-items:center;justify-content:center;line-height:1}
.zbtn:hover{border-color:var(--accent);color:var(--accent)}
.netcap{font-size:.76rem;color:var(--ink-3);margin-top:.6rem;line-height:1.5}
canvas{border:1px solid #1d2638;border-radius:var(--r);background:#0A0E18;display:block;width:100%;cursor:grab}
#nettip{position:fixed;display:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh-lg);padding:.75rem .85rem;max-width:310px;z-index:60;pointer-events:none;line-height:1.4}
.tk-h{display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}
.tk-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
.tk-nm{font-weight:700;font-size:.92rem;line-height:1.25}
.tk-sub{font-size:.78rem;color:var(--ink-2);margin-bottom:.5rem}
.tk-st{font-size:.76rem;color:var(--ink-3)}
.tk-st b{color:var(--ink);font-family:var(--mono);font-weight:600}
.tk-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.55rem}
.tk-tags span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:.12em .6em;font-size:.72rem;color:var(--ink-2)}
.tk-orcid{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);margin-top:.45rem}

/* ---- loader ---- */
.loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;gap:1rem}
.loader .lt{font-size:.95rem;color:var(--ink-2);font-weight:500}
.bar{width:260px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.note{font-size:.78rem;color:var(--ink-3)}

@media(max-width:820px){.hcards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){header{flex-wrap:wrap}.hint{display:none}.home h1{font-size:1.7rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- browse / filter page ---- */
.bfilters{background:var(--surface);border-bottom:1px solid var(--line);padding:.6rem 1.25rem;position:sticky;top:53px;z-index:15;display:flex;flex-direction:column;gap:.45rem}
.brow{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .55rem}
.brow>label{font-size:.7rem;color:var(--ink-3);font-weight:600;white-space:nowrap;flex-shrink:0}
.btxt{flex:1 1 200px;padding:.38rem .65rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);font-size:.84rem;color:var(--ink);outline:none;min-width:0}
.btxt:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-s)}
.bpills{display:flex;flex-wrap:wrap;gap:.22rem}
.bpill{font-size:.7rem;padding:.2rem .48rem;border:1px solid var(--line);border-radius:99px;cursor:pointer;color:var(--ink-2);background:var(--surface);white-space:nowrap;user-select:none;transition:background .1s,color .1s,border-color .1s}
.bpill:hover{border-color:var(--accent);color:var(--accent)}
.bpill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bfw-btn{font-size:.7rem;font-weight:650;color:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:.2rem .65rem;cursor:pointer;white-space:nowrap;flex-shrink:0;min-width:112px;text-align:center;background:var(--surface-2);user-select:none;transition:all .1s}
.bfw-btn:hover{border-color:var(--accent);color:var(--accent)}
.bfw-btn.on{background:var(--accent-s);border-color:var(--accent);color:var(--accent)}
.bsel{padding:.3rem .48rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);font-size:.75rem;color:var(--ink);outline:none;cursor:pointer}
.bsel:focus{border-color:var(--accent)}
.bnum{width:62px;padding:.3rem .42rem;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);font-size:.75rem;color:var(--ink);outline:none;font-family:var(--mono)}
.bnum:focus{border-color:var(--accent)}
.bsep{width:1px;height:14px;background:var(--line);flex-shrink:0;align-self:center}
.bdash{font-size:.8rem;color:var(--ink-3);align-self:center;line-height:1}
.bclear{font-size:.7rem;color:var(--ink-3);cursor:pointer;padding:.2rem .35rem;border-radius:var(--r-sm);margin-left:auto}
.bclear:hover{color:var(--accent)}
.bcount{font-size:.75rem;color:var(--ink-3);padding:.35rem 1.25rem .05rem;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <div class="brand" onclick="location.hash='#/'" title="Home">
    <span class="wm">Horizon <span class="s2">Search</span></span>
  </div>
  <div class="gsearch">
    <span class="gi">⌕</span>
    <input id="q" type="text" placeholder="Describe a topic, technology, or research question…" autocomplete="off">
    <div id="sug"></div>
  </div>
  <div class="hint">Press <span class="kbd">↵</span> to search</div>
  <div class="hbtns">
    <span class="iconbtn" onclick="openInfo()" title="About & model settings" aria-label="About & model settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg></span>
    <span class="iconbtn" onclick="location.hash='#/browse'" title="Browse & filter projects" aria-label="Browse projects">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg></span>
    <span class="iconbtn" onclick="location.hash='#/history'" title="Search history" aria-label="Search history">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg></span>
  </div>
</header>
<main id="app"></main>
<div id="nettip"></div>
<div id="netmodal" class="modal" onclick="if(event.target===this)closeNet()">
  <div class="modalcard">
    <div class="modalhead"><span>Collaboration network</span><span class="modalclose" onclick="closeNet()">✕</span></div>
    <div id="netmbody"></div>
  </div>
</div>
<div id="infomodal" class="modal" onclick="if(event.target===this)closeInfo()">
  <div class="modalcard" id="infocard"></div>
</div>
<div class="loader" id="loader">
  <span class="wm" style="font-size:1.9rem">Horizon <span class="s2">Search</span></span>
  <div class="lt">Loading search index…</div><div class="bar"><div id="barf"></div></div>
  <div class="note" id="lnote">Search index · ~50MB on first load, then cached</div></div>

<div id="ts-widget" style="position:fixed;bottom:0;left:0;opacity:0;pointer-events:none"></div>
<script src="apikey.local.js" onerror="window.GEMINI_API_KEY=window.GEMINI_API_KEY||''"></script>
<script>
const G={}, LAYERS=['topics','projects','units','people','works'];
const TYPE={t:{a:'topics',n:'Topic',c:'t-t'},p:{a:'projects',n:'Project',c:'t-p'},
  u:{a:'units',n:'Organisation',c:'t-u'},
  r:{a:'people',n:'Researcher',c:'t-r'},w:{a:'works',n:'Paper',c:'t-w'}};
const A2T={topics:'t',projects:'p',units:'u',people:'r',works:'w'};
const ENTC={t:'#2D6CC0',p:'#1F8A5B',u:'#C2741C',r:'#159C8E',w:'#4C63B6'};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const deTag=s=>{const d=document.createElement('textarea');d.innerHTML=String(s==null?'':s);return d.value.replace(/<[^>]+>/g,'');};
const eu=v=>v==null?'—':v>=1e9?'€'+(v/1e9).toFixed(2)+'B':v>=1e6?'€'+(v/1e6).toFixed(1)+'M':'€'+Math.round(v/1e3)+'k';
const M=m=>m==null?'':(m>=1000?'€'+(m/1000).toFixed(1)+'B':'€'+(+m).toFixed(0)+'M');
const blk=k=>(G.meta.blocks.find(b=>b.k===k)||{}).color||'#777';
// open-access (OpenAlex oa_status): closed = not OA; null = unknown (not yet backfilled)
const OA_LABEL={gold:'Gold',green:'Green',hybrid:'Hybrid',bronze:'Bronze',diamond:'Diamond',closed:'Closed'};
function oaBadge(s){
  if(s==null) return '';
  if(s==='closed') return `<span class="oa oa-closed"><span class="dot"></span>Closed</span>`;
  return `<span class="oa oa-open" title="OpenAlex oa_status: ${esc(s)}"><span class="dot"></span>Open access · ${OA_LABEL[s]||esc(s)}</span>`;
}
function oaPctOf(W){if(!LOADED.works)return null;let k=0,o=0;for(const wi of W){const s=G.works[wi].oa;if(s!=null){k++;if(s!=='closed')o++;}}return k?Math.round(o/k*100):null;}
// compact pill for the works table's "Access" column (labelled, so it never reads as an entity dot)
function oaCell(s){
  if(s==null) return '<span style="color:var(--ink-3)">—</span>';
  if(s==='closed') return `<span class="oa oa-sm oa-closed" title="Closed (not open access)">Closed</span>`;
  return `<span class="oa oa-sm oa-open" title="Open access · ${esc(s)}">${OA_LABEL[s]||esc(s)}</span>`;
}

/* ---- buy-me-a-coffee (hover popover, click a QR to enlarge) ---- */
const COFFEE=[['wechat','WeChat'],['alipay','Alipay'],['paypal','PayPal']];
const ICON_COFFEE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg>';
const ICON_MAIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>';
function coffeeRow(){return COFFEE.map(([k,l])=>`<div class="qr" onclick="coffeePick('${k}')"><div class="qrimg"><img src="coffee/${k}.jpg" alt="${l}"></div><span>${l}</span></div>`).join('');}
function coffeePick(k){const p=document.getElementById('cpop');if(!p)return;const l=(COFFEE.find(c=>c[0]===k)||[k,k])[1];
  p.innerHTML=`<div class="qr-big" onclick="coffeeReset()"><div class="qrimg"><img src="coffee/${k}.jpg" alt="${l}"></div><div class="lbl">${l}</div><div class="hint">(Click to restore)</div></div>`;}
function coffeeReset(){const p=document.getElementById('cpop');if(p)p.innerHTML=coffeeRow();}
function cornerActions(){return `<div class="corner">
    <div class="bmc" onmouseleave="coffeeReset()">
      <button class="cbtn" aria-label="Buy me a coffee" title="Buy me a coffee">${ICON_COFFEE}</button>
      <div class="cpop" id="cpop">${coffeeRow()}</div>
    </div>
    <a class="fb" href="mailto:songmin.yu@outlook.com?subject=Horizon%20Search%20Feedback" title="Send feedback">${ICON_MAIL}<span>Feedback</span></a>
  </div>`;}

// ---- lazy layer loading: home needs only meta; CORE for search results; people/works on demand ----
const LOADED={}; const CORE=['topics','projects','units']; const FULL=['topics','projects','units','people','works'];
function postProcess(l){const arr=G[l];
  if(l==='topics') arr.forEach(n=>n._s=((n.ti||'')+' '+(n.id||'')+' '+(n.kw||[]).join(' ')).toLowerCase());
  else if(l==='projects'){arr.forEach(n=>n._s=((n.ac||'')+' '+(n.ti||'')+' '+(n.co||'')+' '+(n.id||'')).toLowerCase());
    G.gid2idx={}; arr.forEach((n,i)=>G.gid2idx[n.id]=i);}                 // grant_id → project index
  else if(l==='units') arr.forEach(n=>n._s=((n.nm||'')+' '+(n.c||'')).toLowerCase());
  else if(l==='people') arr.forEach(n=>n._s=((n.nm||'')+' '+(n.i||'')+' '+(n.t||'')).toLowerCase());
  else if(l==='works') arr.forEach(n=>{if(!n.ti)n.ti='(untitled)';n._s=n.ti.toLowerCase();});}
async function loadLayer(l){if(LOADED[l])return; G[l]=await fetch('data/nodes_'+l+'.json').then(r=>r.json()); postProcess(l); LOADED[l]=true;}
async function ensure(names){
  const need=(names||[]).filter(l=>!LOADED[l]); if(!need.length)return;
  const ld=document.getElementById('loader'), bf=document.getElementById('barf'), lt=document.querySelector('#loader .lt');
  if(ld){ld.style.display='flex'; if(lt)lt.textContent='Loading data…'; if(bf)bf.style.width='0%';}
  let done=0;
  await Promise.all(need.map(async l=>{await loadLayer(l); if(bf)bf.style.width=(++done/need.length*100)+'%';}));
  if(ld)ld.style.display='none';
}
async function boot(){
  await loadSpec();                                            // 共享检索规格（search_spec.json）
  G.meta=await fetch('data/graph_meta.json').then(r=>r.json());  // counts only → home renders instantly
  document.getElementById('loader').style.display='none';
  route();
}

/* ---------- search ---------- */
const SIZER={topics:n=>n.P.length,projects:n=>n.eu||0,units:n=>n.ec||0,people:n=>n.lw,works:n=>n.y||0};
function search(q,cap){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length) return [];
  const out={t:[],p:[],o:[],r:[],w:[]};
  for(const l of LAYERS){
    const tt=A2T[l], arr=G[l], res=[];
    for(let i=0;i<arr.length;i++){
      const s=arr[i]._s;
      let ok=true; for(const t of terms){ if(!s.includes(t)){ok=false;break;} }
      if(ok) res.push(i);
    }
    res.sort((a,b)=>{
      const A=arr[a]._s.startsWith(terms[0]), B=arr[b]._s.startsWith(terms[0]);
      if(A!==B) return A?-1:1;
      return SIZER[l](arr[b])-SIZER[l](arr[a]);
    });
    out[tt]=res.slice(0,cap);
  }
  return out;
}
function sugLabel(tt,i){
  const n=G[TYPE[tt].a][i];
  if(tt==='t') return [n.ti||n.id, `${n.bk} · ${n.d||''} · ${n.cs||''}`];
  if(tt==='p') return [n.ac||n.ti, `${n.bk} · ${eu(n.eu)} · ${n.co}`];
  if(tt==='u') return [n.nm, `${n.c} · ${eu(n.ec)} · ${n.P.length} projects`];
  if(tt==='r') return [n.nm, `${n.i||''} ${n.c?'· '+n.c:''} · ${n.w} papers`];
  if(tt==='w') return [n.ti, `${n.y||''} · ${n.R.length} authors`];
}
let sugT;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(sugT); sugT=setTimeout(()=>renderSug(e.target.value),120);
});
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=e.target.value.trim();if(v)runQuery(v);}
  if(e.key==='Escape')document.getElementById('sug').style.display='none';
});
document.addEventListener('click',e=>{if(!e.target.closest('.gsearch'))document.getElementById('sug').style.display='none';});
function runQuery(q){document.getElementById('sug').style.display='none';location.hash='#/q/'+encodeURIComponent(q);}
function renderSug(q){
  const box=document.getElementById('sug');
  if(!q.trim()){box.style.display='none';return;}
  box.innerHTML=`<div class="si si-go" onclick="runQuery(document.getElementById('q').value)"><span class="dot" style="background:var(--accent)"></span><span class="nm">Search “${esc(q)}”</span><span class="sb">Enter ↵</span></div>`;
  box.style.display='block';
}
function go(tt,i){document.getElementById('sug').style.display='none';document.getElementById('q').value='';location.hash=`#/${tt}/${i}`;}

/* ---------- routing + breadcrumb ---------- */
let trail=[];
window.addEventListener('hashchange',route);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeNet();closeInfo();}});
async function route(){
  if(!G.meta)return;
  if(SEARCH_ABORT){SEARCH_ABORT.abort();SEARCH_ABORT=null;}   // cancel any in-flight 检索 on navigation
  const tip=document.getElementById('nettip');if(tip)tip.style.display='none';
  const h=location.hash||'#/';
  document.querySelector('header').classList.toggle('home-mode',h==='#/');
  if(h==='#/'){return home();}                                 // home: meta only, instant
  if(h==='#/about'){home();openInfo();return;}                 // deep-link to the About & settings panel
  if(h==='#/history'){window.scrollTo(0,0);await ensure(CORE);return viewHistory();}
  if(h==='#/browse'){window.scrollTo(0,0);await ensure(CORE);return viewBrowse();}
  const mq=h.match(/^#\/q\/([^/]+)(?:\/([pur]))?/);
  if(mq){window.scrollTo(0,0);return dashboard(decodeURIComponent(mq[1]),mq[2]||'p');}  // dashboard ensures CORE itself
  const m=h.match(/^#\/([tpruw])\/(\d+)/);
  if(!m)return home();
  const tt=m[1], i=+m[2];
  await ensure(tt==='t'||tt==='u' ? CORE : FULL);             // project/researcher/work pages need people+works
  if(location.hash!==h) return;                                // user navigated away while loading
  const k=tt+i, at=trail.findIndex(x=>x.k===k);
  if(at>=0) trail=trail.slice(0,at+1); else trail.push({k,tt,i});

/* ---------- network builders (scoped to a project set) ---------- */
function worksOf(pset){const W=new Set();for(const pi of pset)for(const w of G.projects[pi].W)W.add(w);return W;}
function cliqueEdges(groups, keep){ // groups: arrays of node-keys; keep: Map key->localIdx
  const ew=new Map();
  for(const g of groups){const ks=g.filter(x=>keep.has(x)).map(x=>keep.get(x));
    for(let a=0;a<ks.length;a++)for(let b=a+1;b<ks.length;b++){const k=Math.min(ks[a],ks[b]),l=Math.max(ks[a],ks[b]);const key=k*100000+l;ew.set(key,(ew.get(key)||0)+1);}}
  return [...ew].map(([key,w])=>[Math.floor(key/100000),key%100000,w]);
}
function peopleNet(pset,MEGA=25){   // ALL researchers in the project set (no cap)
  const W=worksOf(pset), cnt=new Map();
  for(const w of W)for(const r of G.works[w].R)cnt.set(r,(cnt.get(r)||0)+1);
  const top=[...cnt.entries()].sort((a,b)=>b[1]-a[1]);
  const keep=new Map(top.map(([ri],k)=>[ri,k]));
  const nodes=top.map(([ri,c])=>({tt:'r',idx:ri,size:c,setn:c,label:G.people[ri].nm,color:ENTC.r,click:()=>location.hash='#/r/'+ri}));
  const groups=[];for(const w of W){const R=G.works[w].R;if(R.length<=MEGA)groups.push(R);}
  return {nodes,edges:cliqueEdges(groups,keep),total:cnt.size};
}
function unitNet(pset){   // ALL participating units in the project set (no cap)
  const ec=new Map(), groups=[];
  for(const pi of pset){const ids=[];
    for(const [ui,e] of G.projects[pi].U){ec.set(ui,(ec.get(ui)||0)+e);ids.push(ui);}
    groups.push(ids);}
  const top=[...ec.entries()].sort((a,b)=>b[1]-a[1]);
  const keep=new Map(top.map(([ui],k)=>[ui,k]));
  const nodes=top.map(([ui,e])=>({tt:'u',idx:ui,size:e||1,setec:e,label:G.units[ui].nm,color:ENTC.u,click:()=>location.hash='#/u/'+ui}));
  return {nodes,edges:cliqueEdges(groups,keep),total:ec.size};
}

function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function lighten(h,amt){const n=parseInt(h.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;
  r=Math.round(r+(255-r)*amt);g=Math.round(g+(255-g)*amt);b=Math.round(b+(255-b)*amt);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function NETH(){return Math.max(460, Math.min(820, window.innerHeight-300));}
function drawNet(canvas,net){
  const W=canvas.width=canvas.clientWidth||900, H=canvas.height=NETH(), ctx=canvas.getContext('2d');
  const N=net.nodes, E=net.edges, tip=document.getElementById('nettip');
  if(!N.length){ctx.fillStyle='#0B0F1A';ctx.fillRect(0,0,W,H);ctx.fillStyle='#8a93a0';ctx.font='14px sans-serif';ctx.fillText('Not enough data to form a network',24,40);return;}
  const big=N.length>260||E.length>3500;
  const mx=Math.max(...N.map(n=>n.size))||1;
  N.forEach(n=>{n.r=(big?2.2:3)+(big?8:11)*Math.sqrt(n.size/mx);});  // radius always
  // ---- grid-accelerated force layout (run once, cached on the net via _laid) ----
  if(!net._laid){
  N.forEach((n,k)=>{const a=k*2.399,rad=Math.sqrt(k/N.length)*Math.min(W,H)*0.46;n.x=W/2+Math.cos(a)*rad;n.y=H/2+Math.sin(a)*rad;n.vx=0;n.vy=0;});
  const REST=145, REP=big?3200:3000, CELL=150, ITER=N.length>800?110:N.length>300?160:300;
  for(let it=0;it<ITER;it++){
    const grid=new Map();
    for(let i=0;i<N.length;i++){const key=Math.floor(N[i].x/CELL)+','+Math.floor(N[i].y/CELL);let c=grid.get(key);if(!c)grid.set(key,c=[]);c.push(i);}
    for(let i=0;i<N.length;i++){const gx=Math.floor(N[i].x/CELL),gy=Math.floor(N[i].y/CELL);
      for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const c=grid.get((gx+ox)+','+(gy+oy));if(!c)continue;
        for(const j of c){if(j<=i)continue;
          let dx=N[i].x-N[j].x,dy=N[i].y-N[j].y,d2=dx*dx+dy*dy||1,d=Math.sqrt(d2);if(d>CELL*2)continue;
          const f=REP/d2,fx=dx/d*f,fy=dy/d*f;N[i].vx+=fx;N[i].vy+=fy;N[j].vx-=fx;N[j].vy-=fy;
          const min=(N[i].r+N[j].r)*1.6+14;if(d<min){const p=(min-d)/d*0.5,px=dx*p,py=dy*p;N[i].x+=px;N[i].y+=py;N[j].x-=px;N[j].y-=py;}}}}
    for(const[a,b,w]of E){let dx=N[b].x-N[a].x,dy=N[b].y-N[a].y,d=Math.hypot(dx,dy)||1,f=(d-REST)*0.007*Math.min(1.3,0.4+w*0.2),fx=dx/d*f,fy=dy/d*f;
      N[a].vx+=fx;N[a].vy+=fy;N[b].vx-=fx;N[b].vy-=fy;}
    for(const n of N){n.vx+=(W/2-n.x)*0.0009;n.vy+=(H/2-n.y)*0.0009;n.x+=Math.max(-14,Math.min(14,n.vx));n.y+=Math.max(-14,Math.min(14,n.vy));n.vx*=0.9;n.vy*=0.9;}
  }
  net._laid=true;
  }
  const xs=N.map(n=>n.x),ys=N.map(n=>n.y),mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys),pad=50;
  const s=Math.min((W-2*pad)/((mxx-mnx)||1),(H-2*pad)/((mxy-mny)||1));
  N.forEach(n=>{n.px=pad+(n.x-mnx)*s;n.py=pad+(n.y-mny)*s;n.R=n.r*s;});
  const nbr=N.map(()=>new Set());for(const[a,b]of E){nbr[a].add(b);nbr[b].add(a);}
  const labelSet=new Set([...N.keys()].sort((a,b)=>N[b].size-N[a].size).slice(0,16));
  // ---- offscreen base bitmap: full graph, redrawn only on layout / zoom-settle ----
  const base=document.createElement('canvas');base.width=W;base.height=H;const bx=base.getContext('2d');

    if(big){bx.strokeStyle='rgba(120,150,205,.09)';bx.lineWidth=0.7/v.k;bx.beginPath();
      for(const[a,b]of E){if(a>=vn||b>=vn||!(inView(N[a],60)||inView(N[b],60)))continue;bx.moveTo(N[a].px,N[a].py);bx.lineTo(N[b].px,N[b].py);}bx.stroke();}

      for(const p of placed){if(box.x<p.x+p.w&&box.x+box.w>p.x&&box.y<p.y+p.h&&box.y+box.h>p.y){ok=false;break;}}

    const R=n.R,hg=ctx.createRadialGradient(n.px,n.py,0,n.px,n.py,R*2.8);hg.addColorStop(0,hexA(n.color,.6));hg.addColorStop(.5,hexA(n.color,.2));hg.addColorStop(1,hexA(n.color,0));

  let drag=null;
  canvas.onwheel=e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),mx2=e.clientX-r.left,my2=e.clientY-r.top;

  canvas.onmousemove=e=>{const r=canvas.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;

    const k=hit(sx,sy);canvas.style.cursor=(k>=0&&N[k].click)?'pointer':'grab';

    if(k>=0){tip.innerHTML=tipHTML(N[k]);tip.style.display='block';const tw=tip.offsetWidth||280,th=tip.offsetHeight||90;
      let lx=e.clientX+14,ly=e.clientY+14;if(lx+tw>innerWidth-8)lx=e.clientX-tw-14;if(ly+th>innerHeight-8)ly=e.clientY-th-14;

function geminiPayload(schema,maxOut,model){const cfg={temperature:0,responseMimeType:'application/json',responseSchema:schema,maxOutputTokens:maxOut};

  if(fr==='SAFETY'||fr==='PROHIBITED_CONTENT'||fr==='RECITATION')throw new Error('Gemini refused the request ('+fr+')');
  const txt=(cand?.content?.parts||[]).map(p=>p.text||'').join(''); if(!txt)throw new Error('Gemini returned empty (finishReason='+(fr||'?')+')');

// per-call dispatcher for the IN-BROWSER pipeline (llmSearch) — used only for BYOK keys and the
// localhost direct-Gemini key, where the browser fetch has no edge timeout. The hosted default
// (no key) runs server-side via hostedSearch(), not here. A BYOK failure throws → dashboard()
// catches it and falls back to hostedSearch for the rest of the search.
let SEARCH_FALLBACK=null;   // set when a BYOK key failed and we fell back to the hosted default; shown as a notice
async function llmCall(prompt,schema,maxOut,signal,stage){
  const c=loadLLMCfg(), key=(c.keys[c.provider]||'').trim();
  if(key){                                                  // BYOK: call the user's provider directly
    const model=c.models[c.provider][stage]||LLM_DEFAULTS[c.provider][stage];
    if(c.provider==='deepseek') return await callDeepSeek(model,key,prompt,maxOut,signal);
    if(c.provider==='openai')  return await callOpenAI(model,key,prompt,maxOut,signal);
    if(c.provider==='claude')  return await callClaude(model,key,prompt,maxOut,signal);
    return await callGemini(model,key,prompt,schema,maxOut,signal);
  }
  // no BYOK key → localhost direct-Gemini dev path (useDirectKey() guaranteed by caller)
  return callGemini((stage==='rerank')?SEARCH_CFG.proModel:SEARCH_CFG.model, window.GEMINI_API_KEY, prompt, schema, maxOut, signal);

// ---- hosted search: submit a job (Turnstile-gated) → poll the background fn for progress/result ----
function sleep(ms,signal){return new Promise((res,rej)=>{const t=setTimeout(res,ms);
  if(signal)signal.addEventListener('abort',()=>{clearTimeout(t);rej(new DOMException('aborted','AbortError'));},{once:true});});}
async function hostedSearch(query,setStep,signal){
  setStep('Verifying…',' ');
  const token=await getTurnstileToken();
  const r=await fetch('/.netlify/functions/search',{method:'POST',headers:{'Content-Type':'application/json'},signal,
    body:JSON.stringify({action:'start',turnstile:token,query})});
  if(!r.ok) throw new Error((await r.text()).slice(0,200)||('HTTP '+r.status));
  const {jobId}=await r.json(); if(!jobId) throw new Error('could not start search');
  const STEPS=['Route','Screen','Score','Re-rank'], t0=Date.now();
  for(;;){
    await sleep(2500,signal);
    if(Date.now()-t0>600000) throw new Error('search timed out — please try again');   // bg fn has a 15-min budget; v4-pro can take 3–5 min
    let s; try{
      s=await fetch('/.netlify/functions/search',{method:'POST',headers:{'Content-Type':'application/json'},signal,
        body:JSON.stringify({action:'status',jobId})}).then(x=>x.json());
    }catch(e){ if(signal&&signal.aborted) throw e; s={state:'pending'}; }
    if(s.state==='done'){
      return (s.ranked||[]).map(x=>({pi:G.gid2idx[x.g],score:x.score,reason:x.reason||''})).filter(r=>r.pi!=null);
    }
    if(s.state==='error') throw new Error(s.error||'search failed');
    const step=s.step>=0?s.step:0;

  }
}

// 容错解析：整数数组（即使被截断也尽量抠出 id）
function parseIdArray(txt){
  try{const a=JSON.parse(txt); if(Array.isArray(a))return a.filter(Number.isFinite);}catch(e){}
  return (txt.match(/\d{5,}/g)||[]).map(Number);   // grant_id 都是 5+ 位整数
}
// 容错解析：对象数组（截断时保留已完整的对象）
function parseObjArray(txt){
  try{const a=JSON.parse(txt); if(Array.isArray(a))return a;}catch(e){}
  const out=[], re=/\{[^{}]*\}/g; let m;
  while((m=re.exec(txt)))try{out.push(JSON.parse(m[0]));}catch(e){}
  return out;
}

// 各 block 的项目数（用于路由提示）
function blockCounts(){const m={};for(const p of G.projects)m[p.bk]=(m[p.bk]||0)+1;return m;}
// 第 0 段：路由 → 该搜哪些 block
async function routeBlocks(query,signal){
  const bc=blockCounts();
  const info=Object.keys(bc).sort().map(k=>`${k}: ${BLOCK_DESC[k]||k} (${bc[k]})`).join('\n');
  const r=await llmCall(PROMPTS.route(query,info), SCHEMA_BLOCKS, SEARCH_CFG.maxOutRoute, signal, 'route');
  let picked=[]; try{const a=JSON.parse(r.text); if(Array.isArray(a))picked=a.filter(x=>bc[x]);}catch(e){}
  if(!picked.length)picked=Object.keys(bc).filter(k=>r.text.includes(k));
  return picked.length?picked:Object.keys(bc);
}
async function coarseOne(query,lines,count,signal){
  const r=await llmCall(PROMPTS.coarse(query,count,lines), SCHEMA_IDS, SEARCH_CFG.maxOutTokens1, signal, 'coarse');
  return parseIdArray(r.text);
}
// which models a search will actually use (mirrors llmCall's resolution), for shard sizing
function activeModels(){
  const c=loadLLMCfg(), key=(c.keys[c.provider]||'').trim();
  if(key) return {provider:c.provider, coarse:c.models[c.provider].coarse, fine:c.models[c.provider].fine};
  if(useDirectKey()) return {provider:'gemini', coarse:SEARCH_CFG.model, fine:SEARCH_CFG.model};
  return {provider:'deepseek', coarse:LLM_DEFAULTS.deepseek.coarse, fine:LLM_DEFAULTS.deepseek.fine};
}
// DeepSeek/OpenAI models "think" before answering & cap output ~8–32k → use small shards so each call finishes
function shardCfg(){
  const m=activeModels(), oai=m.provider==='deepseek'||m.provider==='openai', pro=x=>/pro/.test(x||'');
  if(!oai) return {cThresh:SEARCH_CFG.shardThreshold, cSize:SEARCH_CFG.shardSize, fSize:SEARCH_CFG.fineShard};
  return {cThresh:pro(m.coarse)?300:400, cSize:pro(m.coarse)?200:300, fSize:pro(m.fine)?40:80};
}
// one coarse shard; on empty/truncation, split in half and retry (mirror of Python coarse_filter)
async function coarseShard(query,arr,toLine,signal,depth=0){
  try{ return await coarseOne(query, arr.map(toLine).join('\n'), arr.length, signal); }
  catch(e){
    if(signal&&signal.aborted) throw e;
    if(depth>=2||arr.length<=120){ console.warn('coarse shard dropped',e); return []; }
    const mid=arr.length>>1;
    const [a,b]=await Promise.all([coarseShard(query,arr.slice(0,mid),toLine,signal,depth+1),
                                   coarseShard(query,arr.slice(mid),toLine,signal,depth+1)]);
    return a.concat(b);
  }
}
// four-stage semantic search: route → adaptive coarse → fine → Pro rerank → [{pi,score,reason}]
async function llmSearch(query,setStep,signal){
  await loadSpec();                                          // 确保共享规格已就绪
  // —— 第 0 段：路由 ——
  setStep('Routing to relevant domains…','Step 0 of 4 · Route');
  const routed=new Set(await routeBlocks(query,signal));
  const cat=await loadCatalog();
  const sub=cat.filter(c=>{const pi=G.gid2idx[c[0]];return pi!=null&&routed.has(G.projects[pi].bk);});
  const toLine=c=>`[${c[0]}] ${c[1]} — ${c[2]} :: ${c[3]}`;
  // —— 第 1 段：自适应粗筛 ——
  const SC=shardCfg();
  setStep('Screening candidates…',`Step 1 of 4 · ${routed.size} domains / ${sub.length} projects`);
  let idRaw;
  if(sub.length<=SC.cThresh){
    idRaw=await coarseShard(query, sub, toLine, signal);
  }else{
    const shards=[]; for(let i=0;i<sub.length;i+=SC.cSize)shards.push(sub.slice(i,i+SC.cSize));
    setStep('Screening in parallel shards…',`Step 1 of 4 · ${shards.length} shards / ${sub.length} projects`);
    const res=await Promise.all(shards.map(sh=>coarseShard(query,sh,toLine,signal)));
    idRaw=res.flat();
  }
  let ids=[...new Set(idRaw)].filter(g=>{const pi=G.gid2idx[g];return pi!=null&&routed.has(G.projects[pi].bk);});
  if(!ids.length)return [];
  // —— 第 2 段：精排（按需分片并行）——
  setStep('Scoring candidates…',`Step 2 of 4 · scoring ${ids.length} candidates`);
  const cand=ids.map(g=>({g,pi:G.gid2idx[g],p:G.projects[G.gid2idx[g]]}));
  const objs={};
  await Promise.all([...new Set(cand.map(c=>c.p.bk))].map(async b=>{objs[b]=await fetch('data/objectives_'+b+'.json',{signal}).then(r=>r.json()).catch(()=>({}));}));
  const bodyOf=cs=>cs.map(c=>`[${c.g}] ${c.p.ti}\nAbstract: ${(objs[c.p.bk]||{})[c.g]||'(no abstract)'}`).join('\n\n');
  let scoredRaw;
  if(cand.length<=SC.fSize){
    const r=await llmCall(PROMPTS.stage2(query,cand.length,bodyOf(cand)), SCHEMA_SCORES, SEARCH_CFG.maxOutTokens2, signal, 'fine');
    scoredRaw=parseObjArray(r.text);
  }else{
    const shards=[]; for(let i=0;i<cand.length;i+=SC.fSize)shards.push(cand.slice(i,i+SC.fSize));
    setStep('Scoring in parallel shards…',`Step 2 of 4 · ${shards.length} shards / ${cand.length} candidates`);
    const res=await Promise.all(shards.map(sh=>llmCall(PROMPTS.stage2(query,sh.length,bodyOf(sh)),SCHEMA_SCORES,SEARCH_CFG.maxOutTokens2,signal,'fine').then(r=>parseObjArray(r.text)).catch(e=>{console.warn('fine shard',e);return [];})));
    scoredRaw=res.flat();
  }
  const seen=new Set();
  let scored=scoredRaw.filter(s=>s&&G.gid2idx[s.g]!=null&&Number.isFinite(s.score)&&!seen.has(s.g)&&seen.add(s.g))
    .sort((a,b)=>b.score-a.score);
  if(!scored.length)throw new Error('Scoring returned no valid scores (unexpected response format)');
  // —— 第 3 段：Pro 总排 ——
  if(scored.length>1){
    const head=scored.slice(0,SEARCH_CFG.rerankIn);
    setStep('Final re-rank with the Pro model…',`Step 3 of 4 · re-ranking top ${head.length}`);
    try{
      const body=head.map(s=>{const p=G.projects[G.gid2idx[s.g]];return `[${s.g}] ${p.ti} (prelim ${s.score})\nAbstract: ${((objs[p.bk]||{})[s.g]||'(no abstract)').slice(0,600)}`;}).join('\n\n');
      const r=await llmCall(PROMPTS.rerank(query,head.length,body), SCHEMA_SCORES, SEARCH_CFG.maxOutTokens2, signal, 'rerank');
      const reSeen=new Set();
      const re=parseObjArray(r.text).filter(s=>s&&G.gid2idx[s.g]!=null&&Number.isFinite(s.score)&&!reSeen.has(s.g)&&reSeen.add(s.g)).sort((a,b)=>b.score-a.score);
      if(re.length){const done=new Set(re.map(s=>s.g)); scored=re.concat(scored.filter(s=>!done.has(s.g)));}
    }catch(e){if(signal.aborted)throw e; console.warn('Pro rerank failed, fallback to fine scores',e);}
  }
  return scored.slice(0,SEARCH_CFG.finalTop).map(s=>({pi:G.gid2idx[s.g], score:s.score, reason:s.reason||''}));
}

async function dashboard(query,tab){
  trail=[];document.getElementById('q').value=query; SEARCH_FALLBACK=null;
  const app=document.getElementById('app');
  await ensure(CORE);                                 // search results need projects/units/topics (~15MB)
  if(LLMCACHE&&LLMCACHE.query===query)return renderDash(query,LLMCACHE.ranked,tab);
  const saved=findHistory(query);                     // restore from history without a new LLM call
  if(saved){const ranked=rankedFromItems(saved.items);
    if(ranked.length){LLMCACHE={query,ranked};return renderDash(query,ranked,tab);}}
  const hosted=!useDirectKey() && !byokKey();          // no local key & no BYOK → run server-side (background fn)
  app.innerHTML=CRUMB+`<div class="searching"><div class="spinner"></div>
    <div class="st" id="ss-t">Preparing search…</div><div class="step" id="ss-s">&nbsp;</div>
    <div class="ss">Four-stage semantic search: route to relevant domains, adaptively shard and screen, score objectives, then a final Pro-model re-rank to the top ${SEARCH_CFG.finalTop}. This can take a few minutes — the page will update as it goes.</div></div>`;
  const setStep=(t,s)=>{const a=document.getElementById('ss-t'),b=document.getElementById('ss-s');if(a)a.textContent=t;if(b)b.textContent=s||' ';};
  const ac=new AbortController(); SEARCH_ABORT=ac;
  try{
    let ranked;
    if(hosted){
      ranked=await hostedSearch(query,setStep,ac.signal);
    }else{
      try{ ranked=await llmSearch(query,setStep,ac.signal); }   // BYOK / local key: orchestrate in-browser (no edge timeout)
      catch(e){
        if(ac.signal.aborted||e.name==='AbortError') throw e;
        if(byokKey()){                                          // BYOK key failed → fall back to the hosted default search
          SEARCH_FALLBACK={provider:loadLLMCfg().provider, reason:(e&&e.message||String(e)).slice(0,160)};
          ranked=await hostedSearch(query,setStep,ac.signal);
        }else throw e;                                          // local direct key failed → surface it
      }
    }
    if(ac.signal.aborted)return;                 // 用户已离开，丢弃结果
    SEARCH_ABORT=null;
    if(!ranked.length){app.innerHTML=CRUMB+'<div class="empty" style="padding:2em">No relevant projects found. Try rephrasing your search.</div>';return;}
    LLMCACHE={query,ranked}; addHistory(query,ranked);
    renderDash(query,ranked,tab);
  }catch(e){
    if(ac.signal.aborted||e.name==='AbortError')return;   // 被用户取消，静默
    SEARCH_ABORT=null;
    app.innerHTML=CRUMB+`<div class="apikey-note">Search failed: <code>${esc(e.message||String(e))}</code><br><br>
      Common causes: the daily limit was reached, a rate limit, or a network problem. Please try again in a moment.</div>`;
  }
}

  if(t==='u'){head=`<tr><th class="l">Organisation</th><th>Country</th><th>Type</th><th class="num">EU funding (in set)</th><th class="num">Projects</th></tr>`;
    rows=slice.map(o=>{const u=G.units[o.ui];return `<tr onclick="location.hash='#/u/${o.ui}'"><td class="l"><b>${esc(u.nm)}</b></td><td>${esc(u.c||'')}</td><td>${esc(u.ty||'')}</td><td class="num">${eu(o.ec)}</td><td class="num">${o.np}</td></tr>`;}).join('');}
  else{head=`<tr><th class="l">Researcher</th><th class="l">Institution</th><th>Country</th><th class="num">Papers (in set)</th><th class="num">Total papers</th><th class="num">Projects</th></tr>`;
    rows=slice.map(o=>{const p=G.people[o.ri];return `<tr onclick="location.hash='#/r/${o.ri}'"><td class="l"><b>${esc(p.nm)}</b></td><td class="l">${esc(p.i||'')}</td><td>${esc(p.c||'')}</td><td class="num">${o.c}</td><td class="num">${p.w}</td><td class="num">${p.P.length}</td></tr>`;}).join('');}
  document.getElementById('enttbl').innerHTML=`<div class="tbl"><table class="ptbl">${head}${rows}</table></div>
    <div class="pager"><span>Page ${pg+1}/${pages} · ${agg.length} total (ranked within set)</span>
      ${pg>0?`<span class="pbtn" onclick="entPage('${t}',${pg-1})">‹ Prev</span>`:''}
      ${pg<pages-1?`<span class="pbtn" onclick="entPage('${t}',${pg+1})">Next ›</span>`:''}</div>`;
}
function entPage(t,p){DASH['pg_'+t]=p;entTablePage(t);window.scrollTo({top:0,behavior:'smooth'});}
function renderProjTable(){
  const c=document.getElementById('tabc'), pset=DASH.pset, pages=Math.max(1,Math.ceil(pset.length/PER)), pg=DASH.page;
  const sc=DASH.score||{}, rs=DASH.reason||{};
  const rows=pset.slice(pg*PER,(pg+1)*PER).map(pi=>{const p=G.projects[pi], s=sc[pi], col=scoreColor(s||0);
    const scoreCell=s!=null?`<span class="relscore" style="background:${col}1f;color:${col}">${s}</span>`:'—';
    const reason=rs[pi]?`<div style="font-size:.78rem;color:var(--ink-3);margin-top:.15rem">${esc(rs[pi])}</div>`:'';
    return `<tr onclick="location.hash='#/p/${pi}'">
      <td class="num">${scoreCell}</td>
      <td class="l"><b>${esc(p.ac||'')}</b><div style="font-size:.82rem;color:var(--ink-2)">${esc((p.ti||'').slice(0,110))}</div>${reason}</td>
      <td>${p.bk}</td><td class="num">${eu(p.eu)}</td>
      <td class="l">${esc(p.co||'')}${p.cc?' ('+esc(p.cc)+')':''}</td>
      <td class="num">${p.U.length}</td><td class="num">${p.W.length}</td></tr>`;}).join('');
  c.innerHTML=`<div class="tbl"><table class="ptbl">
    <tr><th class="num">Score</th><th class="l">Project / title</th><th>Block</th><th class="num">EU funding</th><th class="l">Coordinator</th><th class="num">Orgs</th><th class="num">Papers</th></tr>
    ${rows}</table></div>
    <div class="pager"><span>Page ${pg+1}/${pages} · ${pset.length} projects (ranked by relevance score)</span>
      ${pg>0?`<span class="pbtn" onclick="projPage(${pg-1})">‹ Prev</span>`:''}
      ${pg<pages-1?`<span class="pbtn" onclick="projPage(${pg+1})">Next ›</span>`:''}</div>`;
}
function projPage(p){DASH.page=p;renderProjTable();}

/* ---------- search history page ---------- */
function viewHistory(){
  trail=[];
  const h=getHistory();
  const head=`<div class="crumbs"><a href="#/">🏠 Search</a><span class="sep">›</span>History</div>`;
  if(!h.length){document.getElementById('app').innerHTML=head+
    '<div class="empty" style="padding:2.5em 1em">No searches yet. Search a research direction from the home page and results are saved here automatically.</div>';return;}
  const rows=h.map(e=>`<div class="histrow" onclick="goHistory('${e.id}')">
      <div class="histmain">
        <div class="histq">${esc(e.q)}</div>
        <div class="histmeta">${fmtTime(e.ts)} · ${(e.items||[]).length} projects</div>
      </div>
      <div class="histact">
        <span class="histopen" onclick="event.stopPropagation();goHistory('${e.id}')">Open</span>
        <span class="histdel" title="Delete" onclick="event.stopPropagation();delHistory('${e.id}')">✕</span>
      </div>
    </div>`).join('');
  document.getElementById('app').innerHTML=head+`
    <div class="ehead" style="--ec:var(--chrome)">
      <div class="eyebrow">Search history</div>
      <div class="et" style="font-size:1.3rem">${h.length} saved searches</div>
      <div class="note" style="margin-top:.4rem">Click a search to reopen its results instantly — no new LLM call. History is stored in this browser and kept indefinitely.</div>
    </div>
    <div class="histlist">${rows}</div>`;
}

/* ---------- browse / filter page ---------- */
function viewBrowse(){
  trail=[];
  _augmentProjectSearch();
  const blocks=G.meta.blocks||[];
  const heKeys=blocks.filter(b=>b.fw==='Horizon Europe').map(b=>b.k);
  const h2Keys=blocks.filter(b=>b.fw==='Horizon 2020').map(b=>b.k);
  const countries=[...new Set(G.projects.map(p=>p.cc).filter(Boolean))].sort();
  const heAny=heKeys.some(k=>BROWSE.blocks.has(k));
  const h2Any=h2Keys.some(k=>BROWSE.blocks.has(k));

  const bkPill=(k,label)=>`<span class="bpill${BROWSE.blocks.has(k)?' on':''}" data-bk="${k}" onclick="browsePill(this,'bk')" title="${k}">${label}</span>`;
  const hePills=heKeys.map(k=>bkPill(k,k)).join('');
  const h2Pills=h2Keys.map(k=>bkPill(k,k.replace(/^H2020-/,''))).join('');
  const stPills=['SIGNED','CLOSED','TERMINATED'].map(s=>`<span class="bpill${BROWSE.status.has(s)?' on':''}" data-st="${s}" onclick="browsePill(this,'st')">${s}</span>`).join('');
  const ctryOpts='<option value="">All countries</option>'+countries.map(c=>`<option value="${c}"${c===BROWSE.country?' selected':''}>${c}</option>`).join('');
  const sortOpts=[['eu_desc','EU€ ↓'],['eu_asc','EU€ ↑'],['sd_asc','Start ↑'],['ed_desc','End ↓'],['ac_asc','Acronym']].map(([v,l])=>`<option value="${v}"${v===BROWSE.sort?' selected':''}>${l}</option>`).join('');

  document.getElementById('app').innerHTML=`
<div class="crumbs"><a href="#/">🏠 Search</a><span class="sep">›</span>Browse projects</div>
<div class="bfilters">
  <div class="brow">
    <input class="btxt" id="btxt" type="text" placeholder="Search acronym, title, coordinator, grant ID, topic/call code…" value="${esc(BROWSE.text)}" oninput="BROWSE.text=this.value;BROWSE.page=0;browseApply()">
    <label>Sort</label><select class="bsel" onchange="BROWSE.sort=this.value;BROWSE.page=0;browseApply()">${sortOpts}</select>
  </div>
  <div class="brow">
    <span id="bfw-he" class="bfw-btn${heAny?' on':''}" onclick="browseToggleGroup('he')">Horizon Europe</span>
    <div class="bpills">${hePills}</div>
  </div>
  <div class="brow">
    <span id="bfw-h2" class="bfw-btn${h2Any?' on':''}" onclick="browseToggleGroup('h2')">Horizon 2020</span>
    <div class="bpills">${h2Pills}</div>
  </div>
  <div class="brow">
    <div class="bpills">${stPills}</div>
    <div class="bsep"></div>
    <label>Country</label><select class="bsel" onchange="BROWSE.country=this.value;BROWSE.page=0;browseApply()">${ctryOpts}</select>
    <div class="bsep"></div>
    <label>EU €M</label>
    <input class="bnum" type="number" placeholder="min" min="0" value="${BROWSE.euMin}" oninput="BROWSE.euMin=this.value;BROWSE.page=0;browseApply()">
    <span class="bdash">–</span>
    <input class="bnum" type="number" placeholder="max" min="0" value="${BROWSE.euMax}" oninput="BROWSE.euMax=this.value;BROWSE.page=0;browseApply()">
    <div class="bsep"></div>
    <label>Year</label>
    <input class="bnum" type="number" placeholder="from" min="2014" max="2027" value="${BROWSE.yearFrom}" oninput="BROWSE.yearFrom=this.value;BROWSE.page=0;browseApply()">
    <span class="bdash">–</span>
    <input class="bnum" type="number" placeholder="to" min="2014" max="2027" value="${BROWSE.yearTo}" oninput="BROWSE.yearTo=this.value;BROWSE.page=0;browseApply()">
    <span class="bclear" onclick="browseClear()">Reset</span>
  </div>
</div>
<div id="bcount" class="bcount"></div>
<div id="btable"></div>`;
  browseApply();
}

function browsePill(el,type){
  if(type==='bk'){
    const k=el.dataset.bk;
    if(BROWSE.blocks.has(k))BROWSE.blocks.delete(k); else BROWSE.blocks.add(k);
    el.classList.toggle('on',BROWSE.blocks.has(k));
    _updateBfwBtns();
  } else {
    const s=el.dataset.st;
    if(BROWSE.status.has(s))BROWSE.status.delete(s); else BROWSE.status.add(s);
    el.classList.toggle('on',BROWSE.status.has(s));
  }
  BROWSE.page=0; browseApply();
}
function _updateBfwBtns(){
  const blocks=G.meta.blocks||[];
  const heKeys=blocks.filter(b=>b.fw==='Horizon Europe').map(b=>b.k);
  const h2Keys=blocks.filter(b=>b.fw==='Horizon 2020').map(b=>b.k);
  const he=document.getElementById('bfw-he'), h2=document.getElementById('bfw-h2');
  if(he)he.classList.toggle('on',heKeys.some(k=>BROWSE.blocks.has(k)));
  if(h2)h2.classList.toggle('on',h2Keys.some(k=>BROWSE.blocks.has(k)));
}
function browseToggleGroup(group){
  const blocks=G.meta.blocks||[];
  const keys=blocks.filter(b=>b.fw===(group==='he'?'Horizon Europe':'Horizon 2020')).map(b=>b.k);
  const anyOn=keys.some(k=>BROWSE.blocks.has(k));
  if(anyOn)keys.forEach(k=>BROWSE.blocks.delete(k)); else keys.forEach(k=>BROWSE.blocks.add(k));
  BROWSE.page=0; viewBrowse();
}

function browseApply(){
  const txt=(BROWSE.text||'').toLowerCase().trim();
  const euMin=BROWSE.euMin!==''?+BROWSE.euMin*1e6:null;
  const euMax=BROWSE.euMax!==''?+BROWSE.euMax*1e6:null;
  const yrFrom=BROWSE.yearFrom!==''?+BROWSE.yearFrom:null;
  const yrTo=BROWSE.yearTo!==''?+BROWSE.yearTo:null;
  const indices=[];
  for(let i=0,n=G.projects.length;i<n;i++){
    const p=G.projects[i];
    if(txt&&!p._s.includes(txt))continue;
    if(BROWSE.blocks.size&&!BROWSE.blocks.has(p.bk))continue;
    if(BROWSE.status.size&&!BROWSE.status.has(p.st))continue;
    if(BROWSE.country&&p.cc!==BROWSE.country)continue;
    if(euMin!=null&&(p.eu||0)<euMin)continue;
    if(euMax!=null&&(p.eu||0)>euMax)continue;
    if(yrFrom!=null&&+(p.sd||'0').slice(0,4)<yrFrom)continue;
    if(yrTo!=null&&+(p.sd||'9999').slice(0,4)>yrTo)continue;
    indices.push(i);
  }
  const s=BROWSE.sort;
  if(s==='eu_desc')indices.sort((a,b)=>(G.projects[b].eu||0)-(G.projects[a].eu||0));
  else if(s==='eu_asc')indices.sort((a,b)=>(G.projects[a].eu||0)-(G.projects[b].eu||0));
  else if(s==='sd_asc')indices.sort((a,b)=>(G.projects[a].sd||'').localeCompare(G.projects[b].sd||''));
  else if(s==='ed_desc')indices.sort((a,b)=>(G.projects[b].ed||'').localeCompare(G.projects[a].ed||''));
  else if(s==='ac_asc')indices.sort((a,b)=>(G.projects[a].ac||'').localeCompare(G.projects[b].ac||''));
  BROWSE.indices=indices;
  const cnt=document.getElementById('bcount');
  if(cnt)cnt.textContent=`${indices.length.toLocaleString()} project${indices.length===1?'':'s'}`;
  browseDrawTable();
}

function browseDrawTable(){
  const host=document.getElementById('btable');
  if(!host)return;
  const bHead=`<tr><th class="l">Acronym</th><th class="l">Title</th><th>Block</th><th class="num">EU funding</th><th class="l">Coordinator</th><th>Dates</th><th>Status</th></tr>`;
  pagedTable(host,bHead,BROWSE.indices,pi=>{
    const p=G.projects[pi];
    return `<tr onclick="location.hash='#/p/${pi}'">
      <td class="l"><b>${esc(p.ac||p.id)}</b></td>
      <td class="l">${esc((p.ti||'').slice(0,80))}</td>
      <td style="white-space:nowrap">${p.bk}</td>
      <td class="num">${eu(p.eu)}</td>
      <td class="l">${esc((p.co||'').slice(0,36))}${p.cc?` <span style="color:var(--ink-3)">(${esc(p.cc)})</span>`:''}</td>
      <td style="white-space:nowrap">${(p.sd||'').slice(0,4)}–${(p.ed||'').slice(0,4)}</td>
      <td>${esc(p.st||'')}</td></tr>`;});
}

function browseClear(){
  BROWSE={text:'',blocks:new Set(),status:new Set(),country:'',euMin:'',euMax:'',yearFrom:'',yearTo:'',sort:BROWSE.sort,page:0,indices:[]};
  viewBrowse();
}

  document.getElementById('app').innerHTML=`<div class="home">
    <div class="wordmark-xl">Horizon <span class="s2">Search</span></div>
    <div class="home-sub">Semantic search across EU Horizon 2020 + Horizon Europe funding</div>
    <div class="hsearch"><span class="gi">⌕</span>
