# Netlify deployment for the Horizon Search webapp.
# Deploy from the repo root with the local data in place (webapp/data is gitignored, uploaded by the CLI):
#   netlify deploy --prod
# The hosted search runs in a background function (search-background.mjs); the browser polls
# search.mjs for progress/results. Required env vars (Site settings → Environment):
#   DEEPSEEK_API_KEY — your DeepSeek key (server-side; powers the search, never shipped to the browser)
#   TURNSTILE_SECRET — Cloudflare Turnstile secret key (the public site key goes in webapp/index.html)

[build]
  publish = "webapp"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Tell browsers to always use HTTPS for this domain (avoids stale-HTTP caching after the
# cert was first issued). Applies once a browser has seen it over a valid HTTPS connection.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
